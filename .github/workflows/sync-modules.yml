name: Sync modules from MobileModels

on:
  schedule:
    # 每天 02:30（北京时间，UTC+8）
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略指纹检查，强制重新生成（验证/修复用）'
        type: boolean
        default: false
      dry_run:
        description: '只生成并输出变更统计，不提交（验证用）'
        type: boolean
        default: false
      release:
        description: '构建并发布一个新版本 Release（即使本次无模块变化）'
        type: boolean
        default: false
      notes:
        description: '自定义 Release 说明（留空 = 自动生成）'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-modules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone upstream MobileModels
        run: git clone --depth 1 https://github.com/KHwang9883/MobileModels.git _upstream

      - name: Regenerate modules
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
        run: ./tools/sync_from_upstream.ps1 -UpstreamDir ./_upstream -Force:($env:FORCE -eq 'true')

      - name: Commit & push
        id: commit
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CHANGES_FILE: ${{ runner.temp }}/module-changes.txt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          CHANGED=$(git diff --cached --numstat | wc -l)
          echo "changed files: ${CHANGED}"
          git diff --cached --name-status > "$CHANGES_FILE"
          if [ "${CHANGED}" != "0" ]; then
            git diff --cached --stat | tail -n 12
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo 'dry-run: skip commit & push'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${CHANGED}" = "0" ]; then
            echo 'No changes to commit.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHORT_SHA=$(git -C _upstream rev-parse --short HEAD)
          UPSTREAM_DATE=$(git -C _upstream log -1 --format=%cs)
          git commit -m "sync: MobileModels@${SHORT_SHA} (${UPSTREAM_DATE})"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        id: build
        if: ${{ (steps.commit.outputs.changed == 'true' || inputs.release) && inputs.dry_run != true }}
        shell: pwsh
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          CHANGES_FILE: ${{ runner.temp }}/module-changes.txt
        run: |
          $max = 0
          foreach($line in @(& git ls-remote --tags origin 2>$null)){
            if($line -match 'refs/tags/v(\d+)$'){ $n = [int]$Matches[1]; if($n -gt $max){ $max = $n } }
          }
          $tag = 'v' + ($max + 1)
          Write-Host ('下一个版本: ' + $tag)
          $sha = (git -C _upstream rev-parse HEAD).Trim()
          $date = (git -C _upstream log -1 --format=%cs).Trim()
          ./tools/build_release_assets.ps1 -Tag $tag -UpstreamSha $sha -UpstreamDate $date -ChangesFile $env:CHANGES_FILE -Changed:($env:CHANGED -eq 'true') -WorkflowRun "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish release
        if: ${{ (steps.commit.outputs.changed == 'true' || inputs.release) && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_NOTES: ${{ inputs.notes }}
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          TITLE=$(cat dist/release-title.txt)
          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" > dist/release-notes.md
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TITLE" --notes-file dist/release-notes.md
          fi
          for f in dist/*.zip dist/*.csv dist/SHA256SUMS_*.txt; do
            ok=""
            for i in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              echo "upload retry $i: $f"
              sleep 5
            done
            if [ -z "$ok" ]; then echo "upload failed: $f"; exit 1; fi
          done
          gh release edit "$TAG" --title "$TITLE" --notes-file dist/release-notes.md --draft=false --latest
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
